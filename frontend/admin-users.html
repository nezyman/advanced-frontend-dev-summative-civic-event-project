<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage users · CivicEvents+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="flex min-h-screen flex-col bg-slate-50 text-slate-800" data-guard="admin" data-nav="admin" data-side="users">
  <div id="app-header"></div>

  <main id="main" class="mx-auto w-full max-w-7xl flex-1 px-4 py-8 sm:px-6 lg:px-8">
    <div class="lg:flex lg:gap-8">
      <aside id="admin-sidebar" class="mb-6 lg:mb-0 lg:w-56 lg:shrink-0"></aside>

      <div class="min-w-0 flex-1">
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">Manage users</h1>
        <p class="mt-1 text-sm text-slate-600">View accounts and enable or disable access. Roles cannot be changed from this screen.</p>

        <div class="card mt-6 p-4">
          <label class="label" for="user-filter">Filter this page</label>
          <input id="user-filter" type="search" class="input" placeholder="Search by name or email">
        </div>

        <section class="card mt-6 overflow-hidden" aria-labelledby="h-users">
          <div class="flex items-center justify-between border-b border-slate-200 px-5 py-4">
            <h2 id="h-users" class="text-base font-semibold text-slate-900">Users</h2>
            <span id="count" class="text-sm text-slate-500" aria-live="polite"></span>
          </div>
          <div id="table-wrap" class="overflow-x-auto"></div>
        </section>
        <div id="pager" class="mt-6"></div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/admin-users.js"></script>
</body>
</html>
