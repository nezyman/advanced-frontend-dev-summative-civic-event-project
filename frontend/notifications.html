<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications · CivicEvents+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="flex min-h-screen flex-col bg-slate-50 text-slate-800" data-guard="auth" data-nav="notifications">
  <div id="app-header"></div>

  <main id="main" class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 sm:px-6 lg:px-8">
    <div class="flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">Notifications</h1>
        <p id="summary" class="mt-1 text-sm text-slate-600" aria-live="polite"></p>
      </div>
      <button type="button" id="mark-all" class="btn btn-secondary btn-sm">Mark all as read</button>
    </div>

    <div class="mt-6 flex flex-wrap gap-2" role="group" aria-label="Filter notifications">
      <button type="button" class="btn btn-sm btn-primary" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="btn btn-sm btn-secondary" data-filter="unread" aria-pressed="false">Unread</button>
      <button type="button" class="btn btn-sm btn-secondary" data-filter="event" aria-pressed="false">Events</button>
      <button type="button" class="btn btn-sm btn-secondary" data-filter="announcement" aria-pressed="false">Announcements</button>
      <button type="button" class="btn btn-sm btn-secondary" data-filter="promo" aria-pressed="false">Promos</button>
    </div>

    <div class="mt-6 grid gap-6 lg:grid-cols-5">
      <div id="list" class="min-w-0 space-y-2 lg:col-span-2" aria-live="polite"></div>
      <section id="detail" class="min-w-0 lg:col-span-3" tabindex="-1" aria-label="Notification details"></section>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/notifications.js"></script>
</body>
</html>
