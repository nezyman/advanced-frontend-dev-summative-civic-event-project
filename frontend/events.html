<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events · CivicEvents+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="flex min-h-screen flex-col bg-slate-50 text-slate-800" data-guard="auth" data-nav="events">
  <div id="app-header"></div>

  <main id="main" class="mx-auto w-full max-w-7xl flex-1 px-4 py-8 sm:px-6 lg:px-8">
    <div class="flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">Events</h1>
        <p class="mt-1 text-sm text-slate-600">Find civic events and register in one click.</p>
      </div>
      <a id="create-event" href="event-form.html" class="btn btn-primary hidden">Create event</a>
    </div>

    <form id="filters" class="card mt-6 grid gap-4 p-4 sm:grid-cols-2 lg:grid-cols-5" role="search" aria-label="Filter events">
      <div class="lg:col-span-2">
        <label class="label" for="f-q">Keyword</label>
        <input id="f-q" type="search" class="input" placeholder="Search title or description">
      </div>
      <div>
        <label class="label" for="f-loc">Location</label>
        <input id="f-loc" type="search" class="input" placeholder="e.g. Kigali">
      </div>
      <div>
        <label class="label" for="f-from">From date</label>
        <input id="f-from" type="date" class="input">
      </div>
      <div>
        <label class="label" for="f-to">To date</label>
        <input id="f-to" type="date" class="input">
      </div>
      <div class="flex flex-wrap items-center gap-4 sm:col-span-2 lg:col-span-5">
        <div class="flex items-center gap-2">
          <label class="label" for="f-status">Show</label>
          <select id="f-status" class="input mt-0 w-auto">
            <option value="">All events</option>
            <option value="upcoming">Upcoming and in progress</option>
            <option value="past">Finished</option>
          </select>
        </div>
        <button type="button" id="f-clear" class="btn btn-ghost btn-sm">Clear filters</button>
      </div>
    </form>

    <p id="result-count" class="mt-5 text-sm text-slate-600" aria-live="polite"></p>
    <div id="event-grid" class="mt-4 grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
    <div id="pager" class="mt-8"></div>
  </main>

  <div id="app-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/events.js"></script>
</body>
</html>
