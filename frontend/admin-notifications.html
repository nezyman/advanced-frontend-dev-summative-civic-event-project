<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage notifications · CivicEvents+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="flex min-h-screen flex-col bg-slate-50 text-slate-800" data-guard="admin" data-nav="admin" data-side="adminnotifs">
  <div id="app-header"></div>

  <main id="main" class="mx-auto w-full max-w-7xl flex-1 px-4 py-8 sm:px-6 lg:px-8">
    <div class="lg:flex lg:gap-8">
      <aside id="admin-sidebar" class="mb-6 lg:mb-0 lg:w-56 lg:shrink-0"></aside>

      <div class="min-w-0 flex-1">
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">Manage notifications</h1>
        <p class="mt-1 text-sm text-slate-600">Broadcast notifications are created automatically when you publish an event, announcement or promo. Remove ones you no longer want users to see.</p>

        <section class="card mt-6 p-5" aria-labelledby="h-delete-id">
          <h2 id="h-delete-id" class="text-base font-semibold text-slate-900">Delete by ID</h2>
          <form id="delete-form" class="mt-3 flex flex-wrap items-start gap-3" novalidate>
            <div class="min-w-[16rem] flex-1">
              <label class="label" for="notification-id">Notification ID</label>
              <input id="notification-id" type="text" class="input" placeholder="Paste a notification ID" autocomplete="off">
              <p id="notification-id-error" class="field-error hidden" role="alert"></p>
            </div>
            <button type="submit" id="delete-id-btn" class="btn btn-danger mt-6">Delete notification</button>
          </form>
        </section>

        <section class="card mt-6 overflow-hidden" aria-labelledby="h-all">
          <div class="flex items-center justify-between border-b border-slate-200 px-5 py-4">
            <h2 id="h-all" class="text-base font-semibold text-slate-900">All notifications</h2>
            <span id="count" class="text-sm text-slate-500" aria-live="polite"></span>
          </div>
          <div id="table-wrap" class="overflow-x-auto"></div>
        </section>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/admin-notifications.js"></script>
</body>
</html>
